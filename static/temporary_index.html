<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>COMING SOON</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    background-color: #000099;
    background-image: repeating-linear-gradient(45deg, #000099, #000099 20px, #0000cc 20px, #0000cc 40px);
    color: #00FF00;
    font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;
    text-align: center;
    margin: 0;
    padding: 20px;
  }

  marquee {
    background: #FFFF00;
    color: #FF0000;
    font-weight: bold;
    font-size: 24px;
    padding: 10px 0;
    border-top: 4px dashed #FF00FF;
    border-bottom: 4px dashed #FF00FF;
  }

  .container {
    background-color: #C0C0C0;
    border: 6px outset #FFFFFF;
    max-width: 700px;
    margin: 30px auto;
    padding: 30px;
    box-shadow: 8px 8px 0px #000000;
  }

  h1 {
    color: #FF00FF;
    font-size: 48px;
    text-shadow: 3px 3px 0px #FFFF00, 6px 6px 0px #000000;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }

  .blink {
    animation: blinker 1s linear infinite;
    color: #FF0000;
    font-weight: bold;
    font-size: 28px;
  }

  @keyframes blinker {
    50% { opacity: 0; }
  }

  hr {
    border: none;
    border-top: 4px double #FF00FF;
    margin: 20px 0;
  }

  p {
    color: #000080;
    font-size: 18px;
    line-height: 1.6;
  }

  .under-construction {
    margin: 20px 0;
    font-size: 40px;
  }

  .badge-row {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin: 20px 0;
  }

  .badge {
    background: linear-gradient(#eee, #999);
    border: 2px solid #333;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: bold;
    color: #000;
    box-shadow: 2px 2px 0 #000;
  }

  .counter {
    background: #000;
    color: #0F0;
    font-family: "Courier New", monospace;
    font-size: 22px;
    padding: 5px 12px;
    border: 2px inset #999;
    display: inline-block;
    letter-spacing: 4px;
  }

  .guestbook {
    background-color: #FFFFCC;
    border: 3px ridge #FF00FF;
    padding: 15px;
    margin-top: 25px;
    font-size: 14px;
    color: #333;
  }

  footer {
    margin-top: 20px;
    color: #FFFF00;
    font-size: 12px;
  }

  a {
    color: #00FFFF;
  }
</style>
</head>
<body>

<marquee behavior="scroll" direction="left">*** THIS PAGE IS UNDER CONSTRUCTION ***</marquee>

<div class="container">
  <h1>License Plates Tracker</h1>
  <div class="blink">COMING SOON</div>

  <hr>

</div>

</body>
</html>
